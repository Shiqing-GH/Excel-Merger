name: 打包 Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:   # 允许在网页上手动点击运行

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install pyinstaller openpyxl

      - name: 打包 exe
        run: |
          pyinstaller --onefile --name ExcelMerger excel_merger.py

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: ExcelMerger-Windows
          path: dist/ExcelMerger.exe
